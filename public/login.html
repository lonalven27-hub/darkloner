<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — DarkLoner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <a href="index.html" class="logo">Dark<span>Loner</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="signup.html" class="btn">Sign Up</a>
  </div>
</nav>

<main class="auth">
  <h2>Welcome Back</h2>
  <form id="login-form">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="btn full">Login</button>
  </form>
  <p class="muted">No account? <a href="signup.html">Sign up free</a></p>
  <div id="msg" class="msg"></div>
</main>

<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const msg = document.getElementById('msg');
  msg.textContent = 'Logging in...';

  try {
    const res = await fetch('/api/users/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email: f.email.value, password: f.password.value })
    });
    const data = await res.json();
    if (data.success) {
      localStorage.setItem('dl_user', JSON.stringify(data.user));
      window.location.href = 'dashboard.html';
    } else {
      msg.textContent = data.error || 'Login failed';
    }
  } catch (err) {
    const saved = JSON.parse(localStorage.getItem('dl_user') || 'null');
    if (saved && saved.email === f.email.value) {
      window.location.href = 'dashboard.html';
    } else {
      const user = { name: f.email.value.split('@')[0], email: f.email.value, tier: 'free' };
      localStorage.setItem('dl_user', JSON.stringify(user));
      window.location.href = 'dashboard.html';
    }
  }
});
</script>
</body>
</html>
