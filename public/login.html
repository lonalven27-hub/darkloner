<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — DarkLoner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <a href="index.html" class="logo">Dark<span>Loner</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="signup.html" class="btn">Sign Up</a>
  </div>
</nav>

<main class="auth">
  <h2>Welcome Back</h2>
  <form id="login-form">
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password" required>
    <button type="submit" class="btn full">Login</button>
  </form>
  <p class="muted">No account? <a href="signup.html">Sign up free</a></p>
  <div id="msg" class="msg"></div>
</main>

<script>
async function hashPassword(password) {
  const enc = new TextEncoder();
  const data = enc.encode(password + '::darkloner::salt');
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const msg = document.getElementById('msg');
  msg.textContent = 'Logging in...';

  const email = f.email.value.trim().toLowerCase();
  const password = f.password.value;

  const users = JSON.parse(localStorage.getItem('dl_users') || '[]');
  const user = users.find(u => u.email === email);

  if (!user) { msg.textContent = 'Invalid email or password'; return; }

  const attemptHash = await hashPassword(password);
  if (attemptHash !== user.passwordHash) { msg.textContent = 'Invalid email or password'; return; }

  localStorage.setItem('dl_user', JSON.stringify({ name: user.name, email: user.email, tier: user.tier || 'free' }));
  msg.textContent = '✅ Logged in. Redirecting...';
  setTimeout(() => window.location.href = 'dashboard.html', 600);
});
</script>
</body>
</html>
