<h3>Lesson 1 — What is HTML?</h3>
<p>HTML (HyperText Markup Language) is the skeleton of every webpage. It uses <strong>tags</strong> like &lt;h1&gt;, &lt;p&gt;, &lt;div&gt;, &lt;a&gt; to define structure and meaning.</p>
<p>Every HTML file starts with <code>&lt;!DOCTYPE html&gt;</code> and wraps content in <code>&lt;html&gt;</code>.</p>

<h3>Lesson 2 — Document Structure</h3>
<p>Every page has two main parts:</p>
<p><strong>&lt;head&gt;</strong> — metadata, title, links to CSS, scripts. Not visible to user.</p>
<p><strong>&lt;body&gt;</strong> — everything the user sees: headings, paragraphs, images, buttons.</p>

<h3>Lesson 3 — Common Tags</h3>
<p><strong>Headings:</strong> &lt;h1&gt; to &lt;h6&gt; — biggest to smallest.</p>
<p><strong>Paragraphs:</strong> &lt;p&gt;text&lt;/p&gt;</p>
<p><strong>Links:</strong> &lt;a href="url"&gt;click here&lt;/a&gt;</p>
<p><strong>Images:</strong> &lt;img src="pic.jpg" alt="description"&gt;</p>
<p><strong>Lists:</strong> &lt;ul&gt; for bullets, &lt;ol&gt; for numbers, &lt;li&gt; for items.</p>
<p><strong>Forms:</strong> &lt;input&gt;, &lt;button&gt;, &lt;select&gt;, &lt;textarea&gt;.</p>

<h3>Lesson 4 — Attributes</h3>
<p>Attributes give tags extra info. <code>id</code> is unique. <code>class</code> groups elements. <code>href</code> links. <code>src</code> sets the source.</p>

<h3>Lesson 5 — Practice</h3>
<p>Build a personal page: heading, image, paragraph about you, link to your favorite site, and a contact form.</p>

<h3>Lesson 1 — Password Hashing</h3>
<p>Never store plain passwords. Hash with bcrypt:</p>
<p><code>const hash = await bcrypt.hash(password, 10);</code></p>
<p>Verify: <code>await bcrypt.compare(attempt, hash);</code></p>

<h3>Lesson 2 — Sessions</h3>
<p>Server stores session ID. Browser stores cookie. On each request, server checks the cookie against its session store.</p>

<h3>Lesson 3 — JWT (JSON Web Tokens)</h3>
<p>Self-contained tokens. Server signs a token with a secret. Client sends it back on each request. Server verifies signature.</p>
<p><code>jwt.sign({ id: user.id }, SECRET, { expiresIn: '7d' })</code></p>

<h3>Lesson 4 — Cookies vs localStorage</h3>

<h3>Lesson 5 — Common Mistakes</h3>
<p>Storing tokens in localStorage. No rate limiting on login. Weak JWT secrets. No HTTPS. Exposing user IDs in URLs.</p>

<h3>Lesson 6 — 2FA (Two-Factor Auth)</h3>

<p>Injected JavaScript runs in another user's browser. Steals cookies, hijacks sessions. Fix: escape output, sanitize input, CSP.</p>

<h3>Lesson 3 — CSRF</h3>

<h3>Lesson 6 — SSRF</h3>
<p>Server fetches a URL the attacker controls, hits internal services. Fix: whitelist allowed hosts.</p>

<p>Registers: RAX, RBX, RCX, RDX. Stack: RSP, RBP. Instructions: MOV, PUSH, POP, CALL, JMP, CMP, JE, JNE.</p>

<h3>Lesson 3 — Tools</h3>
<p>Ghidra (free, NSA), IDA Free, x64dbg, radare2, Binary Ninja. Start with Ghidra.</p>

<h3>Lesson 4 — Patterns</h3>
<p>Loops look like backward jumps. Conditionals look like CMP + JE/JNE. Function calls are CALL instructions.</p>

<h3>Lesson 5 — Dynamic Analysis</h3>
<p>Run under a debugger. Set breakpoints. Step through. Watch memory.</p>

<h3>Lesson 6 — Crackmes</h3>
<p>Small challenges designed for practice. Start with crackmes.one. Solve 10 beginner ones.</p>

<h3>Lesson 7 — Practice</h3>
<p>Solve a crackme. Patch it so any password works. Then bypass the check entirely.</p>
` },

  '18': { title: 'Red Team Operations', tier: 'elite', desc: 'Full-scope adversary simulation.',
    body: `
<h3>Lesson 1 — Planning</h3>

<p>Phishing, exposed services, supply chain, physical, credential stuffing. Red team's first foothold.</p>

<h3>Lesson 3 — C2 Infrastructure</h3>
<p>Command & control channels. Redirectors hide the real C2. Domain fronting blends with legitimate traffic.</p>

<h3>Lesson 4 — Evasion</h3>
<p>AV/EDR bypass techniques. Living-off-the-land binaries (LOLBins). Signed binary proxy execution. AMSI bypass.</p>

<h3>Lesson 5 — Post-Exploitation</h3>
<p>Credential harvesting, lateral movement, persistence, data exfiltration, cleanup.</p>

<h3>Lesson 6 — OpSec</h3>
<p>Every action leaves a trace. Know what you're leaving. Clean up. Don't get caught by the blue team.</p>

<h3>Lesson 7 — Reporting</h3>
<p>Executive summary, timeline, evidence, blue team feedback, remediation. Tell the story of the attack.</p>

<h3>Lesson 8 — Practice</h3>
<p>TryHackMe Red Team path. HackTheBox Pro Labs. Full-scope simulations.</p>
` }
