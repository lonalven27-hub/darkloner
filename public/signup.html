<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — DarkLoner</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
  <a href="index.html" class="logo">Dark<span>Loner</span></a>
  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="pricing.html">Pricing</a>
    <a href="login.html">Login</a>
  </div>
</nav>

<main class="auth">
  <h2>Create Your Account</h2>
  <form id="signup-form">
    <input type="text" name="name" placeholder="Full name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="password" name="password" placeholder="Password (8+ characters)" required minlength="8">
    <button type="submit" class="btn full">Sign Up Free</button>
  </form>
  <p class="muted">Already have an account? <a href="login.html">Login</a></p>
  <div id="msg" class="msg"></div>
</main>

<script>
async function hashPassword(password) {
  const enc = new TextEncoder();
  const data = enc.encode(password + '::darkloner::salt');
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('signup-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const msg = document.getElementById('msg');
  msg.textContent = 'Creating account...';

  const name = f.name.value.trim();
  const email = f.email.value.trim().toLowerCase();
  const password = f.password.value;

  if (password.length < 8) { msg.textContent = 'Password must be 8+ characters'; return; }

  const users = JSON.parse(localStorage.getItem('dl_users') || '[]');
  if (users.some(u => u.email === email)) { msg.textContent = 'Email already registered'; return; }

  const passwordHash = await hashPassword(password);
  const user = { name, email, passwordHash, tier: 'free', created: Date.now() };
  users.push(user);
  localStorage.setItem('dl_users', JSON.stringify(users));
  localStorage.setItem('dl_user', JSON.stringify({ name, email, tier: 'free' }));

  msg.textContent = '✅ Account created. Redirecting...';
  setTimeout(() => window.location.href = 'dashboard.html', 700);
});
</script>
</body>
</html>
